name: kamd-regions-desktop
# Builds the KAMD Regions desktop app (PyInstaller) on Linux, macOS and Windows, starts each build
# once with a built-in self-test (loads the Amber test system in the native window), and uploads
# the packaged app as a workflow artifact.
on:
  workflow_dispatch:
  push:
    branches: ["main", "kamd-regions-gui"]
    tags: ["kamd-regions-v*"]
    paths:
      - "tools/kamd-regions/packaging/**"
      - "tools/kamd-regions/kamd_regions/desktop.py"
      - ".github/workflows/kamd-regions-desktop.yml"
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: macos-14
            name: macos-arm64
          - os: windows-2022
            name: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Linux system libraries for Qt WebEngine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxkbfile1 libasound2t64
      - name: build frontend
        working-directory: tools/kamd-regions/frontend
        run: npm ci && npm run build
      - name: install
        run: |
          pip install --no-deps ./openmm
          pip install "./tools/kamd-regions[desktop]" pyinstaller
          if [ "$RUNNER_OS" = "Linux" ]; then pip install PySide6 qtpy; fi
      - name: pyinstaller
        working-directory: tools/kamd-regions/packaging
        run: pyinstaller --noconfirm --log-level WARN kamd-regions.spec
      - name: self-test the built app
        timeout-minutes: 8
        working-directory: tools/kamd-regions/packaging
        env:
          KAMD_REGIONS_CONFIG: ${{ runner.temp }}/kamd-cfg
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
        shell: python
        run: |
          # start the built app on the Amber test system and check what the window shows
          import json, os, pathlib, subprocess, sys
          test = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "amber" / "test"
          app = {"Linux": ["xvfb-run", "-a", "-s", "-screen 0 1600x1000x24", "dist/KAMD Regions/kamd-regions-app"],
                 "macOS": ["dist/KAMD Regions.app/Contents/MacOS/kamd-regions-app"],
                 "Windows": [r"dist\KAMD Regions\kamd-regions-app.exe"]}[os.environ["RUNNER_OS"]]
          out = pathlib.Path("selftest.json").resolve()
          cmd = app + [str(test / "prmtop"), str(test / "restrt"), str(test / "md_test.in"), "--selftest", str(out)]
          try:
              subprocess.run(cmd, timeout=300)
          except subprocess.TimeoutExpired:
              print("the app did not finish within 300 s")
          log = pathlib.Path(os.environ["KAMD_REGIONS_CONFIG"]) / "kamd-regions.log"
          print("--- app log"); print(log.read_text() if log.exists() else "(none)")
          r = json.loads(out.read_text()) if out.exists() else {}
          print("--- result", r)
          st = r.get("state") or {}
          sys.exit(0 if r.get("ok") and st.get("screen") == "main" and st.get("regions") == 4 else 1)
      - name: package
        working-directory: tools/kamd-regions/packaging/dist
        run: |
          case "$RUNNER_OS" in
            Linux)   tar czf "../kamd-regions-${{ matrix.name }}.tar.gz" "KAMD Regions" ;;
            macOS)   ditto -c -k --keepParent "KAMD Regions.app" "../kamd-regions-${{ matrix.name }}.zip" ;;
            Windows) 7z a -tzip "../kamd-regions-${{ matrix.name }}.zip" "KAMD Regions" > /dev/null ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: kamd-regions-${{ matrix.name }}
          path: tools/kamd-regions/packaging/kamd-regions-${{ matrix.name }}.*
          retention-days: 30
